<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trabalho Educativo — Pontos &amp; Presença</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>

<div id="login-screen" class="login-screen">
  <form id="login-form" class="login-card">
    <div class="login-brand">Trabalho Educativo</div>
    <div class="login-sub">Pontos &amp; presença de bolsistas</div>
    <label>E-mail<input type="email" name="email" required autocomplete="username"></label>
    <label>Senha<input type="password" name="password" required autocomplete="current-password"></label>
    <div class="login-error" id="login-error" hidden></div>
    <button class="btn btn-primary" type="submit">Entrar</button>
    <div class="login-switch">Aluno da faculdade e ainda não tem login? <a href="#" id="show-signup">Cadastre-se com seu RA</a></div>
  </form>

  <form id="signup-form" class="login-card" hidden>
    <div class="login-brand">Trabalho Educativo</div>
    <div class="login-sub">Criar seu login (bolsista da faculdade)</div>
    <label>RA (matrícula)<input type="text" name="ra" required autocomplete="off" inputmode="numeric"></label>
    <label>E-mail<input type="email" name="email" required autocomplete="username"></label>
    <label>Senha<input type="password" name="password" required minlength="6" autocomplete="new-password"></label>
    <label>Confirmar senha<input type="password" name="password2" required minlength="6" autocomplete="new-password"></label>
    <div class="login-error" id="signup-error" hidden></div>
    <button class="btn btn-primary" type="submit">Criar login</button>
    <div class="login-switch">Já tem login? <a href="#" id="show-login">Entrar</a></div>
  </form>
</div>

<div id="app" hidden></div>
<div class="toast-stack" id="toast-stack"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="app.js"></script>
<script type="module" src="firebase-init.js"></script>
</body>
</html>
